<style>
:root{--g:#2fb36a;--o:#f0932b;--r:#e5484d;--bg:#f3f4f8;--card:#fff;--tx:#14161c;--mu:#6b7080;--ac:#4a63d8;--bd:#dfe2ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--tx:#eceef3;--mu:#8b90a0;--ac:#9db4ff;--bd:#2c303d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mu);margin:0 0 16px}
.back{background:none;border:0;color:var(--ac);font:inherit;padding:8px 0;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row.tap{cursor:pointer}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.m{color:var(--mu);font-size:13px}
.rk{width:26px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
.chip{min-width:52px;text-align:center;font-weight:700;border-radius:8px;padding:4px 6px;border:2px solid;font-variant-numeric:tabular-nums}
input,textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}

.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.ghost:disabled{opacity:.25;cursor:default}
.add{display:flex;gap:8px;margin:14px 0}
.add .btn{white-space:nowrap}
.mv{display:flex;flex-direction:column;gap:3px}
.mv .ghost{padding:1px 8px;font-size:12px;line-height:1.3}
.warn{color:#e5484d;border-color:#e5484d}
input.ck{width:22px;height:22px;accent-color:var(--ac);flex:none}
.dn{color:var(--mu);text-decoration:line-through}
.hcol{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}.nt.npv{margin:0 0 10px}
.nh{display:flex;gap:10px;align-items:flex-start}.ntag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding-top:3px;min-width:58px}.nbody{white-space:pre-wrap;font-size:14px;margin:6px 0 8px;cursor:pointer}.nrow.dn .nbody,.nrow.dn .t{opacity:.5;text-decoration:line-through}.nrow select{width:100%}
.mem{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}.mbar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}.mbar i{display:block;height:100%;background:var(--ac);border-radius:99px}.mem.warn .mbar i{background:#e5484d}
.tgb{align-self:flex-start;padding:6px 12px;font-size:13px;white-space:nowrap;flex:none}.tgb.on{border-color:var(--ac);color:var(--ac)}
.chips{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto}.chips button{flex:none;padding:6px 12px;font-size:13px;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;min-width:0;padding:8px 4px;font-size:14px;white-space:nowrap}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:inherit}
.disc{display:flex;align-items:center;gap:10px;margin:20px 0 8px;padding:10px 12px;border-left:4px solid var(--ac);border-radius:10px;background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.disc .t{flex:1;font-size:18px}.disc .chip{font-size:18px;min-width:64px}

.ed{padding:3px 8px;font-size:14px;vertical-align:middle}.edf{display:flex;gap:8px;align-items:center;margin:8px 0;flex:1;min-width:0}.edf input{flex:1;min-width:0}.nm{cursor:pointer}

/* ===== Design "Nothing" ===== */

html[data-design=nothing] .ghost{border-radius:999px;border-color:var(--bd2);font-family:"Space Mono",ui-monospace,monospace;font-size:13px;color:var(--tx)}

html[data-design=nothing] input,html[data-design=nothing] textarea,html[data-design=nothing] select{border-radius:16px;background:var(--card);border-color:var(--bd2);color:var(--tx)}
html[data-design=nothing] input:focus,html[data-design=nothing] textarea:focus{outline:none;border-color:#ff3b3b}
html[data-design=nothing] input.ck{accent-color:#ff3b3b}

html[data-design=nothing] .disc .t{font-family:"Space Mono",ui-monospace,monospace;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
html[data-design=nothing] .back{color:#ff3b3b;font-family:"Space Mono",ui-monospace,monospace;font-size:13px}
html[data-design=nothing] .hb.on,html[data-design=nothing] .warn{color:#ff3b3b;border-color:#ff3b3b}
html[data-design=nothing] .hl{outline:1.5px solid #ff3b3b;background:color-mix(in srgb,#ff3b3b 12%,var(--card))}
html[data-design=nothing] .dsn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b3b;margin-right:6px}

/* Vergleich */
.pick{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px}.pick select{width:100%;margin-top:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.cmc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 8px;text-align:center;min-width:0}.cmc .t{overflow-wrap:anywhere}
.cmc .big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0}.cmc.win{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
.srow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.srow .v{font-weight:700;text-align:center}.srow .v.w{color:var(--g)}.srow .l{color:var(--mu);font-size:12px;text-align:center;min-width:96px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.cell{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;min-height:46px;min-width:0}
.cell.win{border-color:var(--g)}.cell .t{font-size:13px;font-weight:600;flex:1;min-width:0}.cell .chip{min-width:38px;padding:2px 4px;font-size:14px}
.cell .n{color:var(--mu);font-size:11px;width:15px;text-align:right;flex:none}
.verd{text-align:center;font-weight:700;margin:6px 0 10px}
html[data-design=nothing] .pick,html[data-design=nothing] .cmc{border-radius:22px}html[data-design=nothing] .cell{border-radius:18px}
html[data-design=nothing] .cmc .big{font-family:"Doto","Space Mono",ui-monospace,monospace;font-weight:900}
/* Archiv */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ac);color:var(--bg);white-space:nowrap}
.arc{margin:0 0 8px}.arc .body{padding:4px 4px 8px}
.ah{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:12px 0 4px;display:flex;align-items:center;gap:7px}
.ah::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mu)}
.ah.n::before{background:var(--g)}.ah.c::before{background:var(--o)}.ah.f::before{background:var(--r)}
.al{margin:0;padding-left:20px}.al li{margin:3px 0}
.subu{margin:12px 0 4px;padding:10px 12px;border-left:3px solid var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--card));border-radius:10px}
.lnk{display:block;margin:14px auto 0;background:none;border:0;color:var(--mu);font:inherit;font-size:13px;padding:8px;cursor:pointer}
html[data-design=nothing] .pill{font-family:"Space Mono",ui-monospace,monospace}
html[data-design=nothing] .subu{border-radius:18px}
/* Highlights ein-/ausklappen, Farben, Swatches */
.fold{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:8px 0 6px;border:1px solid var(--bd);border-radius:12px;background:var(--card);cursor:pointer;font-weight:700}
.chev{width:14px;color:var(--mu);flex:none}
.au{text-decoration:underline;text-decoration-color:var(--au);text-decoration-thickness:3px;text-underline-offset:4px}
.am{background:color-mix(in srgb,var(--au) 32%,transparent);padding:1px 7px;border-radius:7px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;font-size:14px;line-height:1;color:var(--mu);background:none}
.sw.on{outline:3px solid var(--tx);outline-offset:2px}
.sw.no{border-color:var(--bd)}
.bn.bnx{border-color:#e5484d;border-left-color:#e5484d;background:color-mix(in srgb,#e5484d 10%,var(--card))}.mb.due{position:relative}.mb.due::after{content:'';position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px var(--bg)}.bn .x{position:absolute;top:8px;right:8px;padding:2px 9px}
html[data-design=nothing] .fold{border-radius:22px;font-family:"Space Mono",ui-monospace,monospace;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
html[data-design=nothing] .fold .au,html[data-design=nothing] .fold .am{text-transform:none}
/* Neuerscheinungen */
.top .mb{position:relative}.bdg{position:absolute;top:-7px;right:-7px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;line-height:19px;text-align:center;padding:0 5px;font-family:system-ui,sans-serif}
.nwb{display:flex;gap:6px;flex-wrap:nowrap}.nwb .btn,.nwb .ghost{white-space:nowrap}
.cand{cursor:pointer}
button:disabled{opacity:.45}
/* Kopfleiste + Menü */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;margin:-16px -14px 6px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
.top .brand{font-weight:800;font-size:18px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.top .brand i{width:9px;height:9px;border-radius:50%;background:#e5484d;display:inline-block}
.top .mb{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:12px;width:42px;height:38px;font-size:20px;line-height:1;cursor:pointer}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.35)}

.sh .tabs{margin-bottom:6px}
.sh .mi{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin-top:6px;padding:12px 14px}
html[data-design=nothing] .top{border-bottom-color:var(--bd)}
html[data-design=nothing] .top .brand{font-family:"Doto","Space Mono",ui-monospace,monospace;font-weight:900;font-size:24px;letter-spacing:.03em}
html[data-design=nothing] .top .mb{border-radius:999px;width:46px}
html[data-design=nothing] .sh{border-radius:28px 28px 0 0;background:#111;border-color:#2c2c2c}
html[data-design=nothing][data-eff=light] .sh{background:#fff;border-color:#d4d2cb}
html[data-design=nothing] .sc{background:rgba(0,0,0,.72)}
html[data-design=nothing] .sh h3{font-family:"Space Mono",ui-monospace,monospace}

/* Update 15 */
.top .rt{display:flex;gap:8px;align-items:center}
.top .sb{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:12px;width:42px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

.hn{display:flex;flex-direction:column;gap:2px;flex:none}.hn .ghost{padding:1px 7px;font-size:15px;line-height:1.35}
.hn .nb.on{border-color:var(--ac);color:var(--ac)}
.nt{margin:-4px 2px 8px 34px;padding:7px 11px;border-left:3px solid var(--ac);background:color-mix(in srgb,var(--ac) 7%,var(--card));border-radius:0 10px 10px 0;color:var(--tx);font-size:13px;white-space:pre-wrap;cursor:pointer}
.ntf{margin:-4px 0 10px 34px}.ntf textarea{min-height:64px;margin-bottom:6px}
.cvr{display:block;flex:none;background:var(--bd);border-radius:8px;overflow:hidden}.cvr img{display:block;width:100%;height:100%;object-fit:cover}
.cvr.s{width:46px;height:46px}.cvr.l{width:92px;height:92px;border-radius:12px}.cvr.m{width:70px;height:70px;margin:0 auto 6px}
.albh{display:flex;gap:14px;align-items:flex-start}.albh .grow h1{margin-top:0}
html[data-design=nothing] .cvr.s,html[data-design=nothing] .cvr.m{border-radius:14px}html[data-design=nothing] .cvr.l{border-radius:22px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar.tap{cursor:pointer}
.bar .bl{width:54px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums;flex:none}
.bar .bv{width:44px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}.bar.sel .bl{color:var(--tx);font-weight:700}
.bt{flex:1;height:10px;border-radius:6px;background:var(--bd);overflow:hidden;display:block}.bt i{display:block;height:100%;border-radius:6px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.kp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center}.kp .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.kp .m{font-size:12px}
.vl{margin:4px 0 14px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}.vl svg{width:100%;height:auto;display:block;margin-bottom:6px}

const VER='30.1';
const UPD=[
{v:'30.1',t:'Fingerwischen, Regen, Geheimnisse & mehr',d:'Die Seiten folgen jetzt deinem Finger, es gibt Regen im Design Gemächlich und neue geheime Trophäen.',n:['Neu: Beim Wischen zwischen Bewertungen, Künstlerliste und Statistik folgt die Seite deinem Finger. Die nächste Seite ist schon halb zu sehen und rastet beim Loslassen ein.','Neu: Im Design Gemächlich lässt es regnen, wenn du fünfmal schnell auf den Punkt hinter Coda tippst. Nochmal fünfmal, und der Regen hört auf.','Neu: Singles importieren hat eine eigene Künstlersuche. Du kannst einen anderen Namen eingeben oder den Link der MusicBrainz-Künstlerseite einfügen.','Neu: Die Erinnerung an die Sicherung ist deutlicher. Nach 14 Tagen oder vielen neuen Bewertungen wird sie rot, am Menü erscheint ein Punkt und „Teilen / in Cloud“ steht ganz vorn.','Neu: Geheime Trophäen: Mondsüchtig, Wunsch frei, Geisterstunde, Stammgast und Die perfekte 42. Dazu ein Testschalter im Design-Menü, den man erst finden muss.','Neu: Zeitlich begrenzte Trophäe „Mallorca-Goldkette“. Wer bis zum 8. November 2026 einen Song bewertet, bekommt sie einmal. Sie bleibt dauerhaft und steht in der Sicherung.','Geändert: Statistiken sind nur noch per Wischen erreichbar. „Hör mal wieder rein“ liegt jetzt unter den Benachrichtigungen. Das Menü hat vier Einträge.','Geändert: Der Künstlerkopf ist aufgeräumt. Sortierung steht neben Notiz und Optionen, Verlauf liegt unter Optionen.','Behoben: Im Menü steht beim Design jetzt „Gemächlich“ statt „Standard“.']},
{v:'30',t:'Gemächlich, Wischen & eigene Menüs',d:'Ein neues Design mit Tageszeiten, Wischen zwischen den Hauptseiten und einheitliche Auswahlmenüs.',n:['Neu: Design „Gemächlich“ mit Wiese, Fluss und Wolken. Es gibt vier Tageszeiten (Morgen, Mittag, Abend, Nacht). Sonne und Mond wandern im Tagesverlauf, der Mond zeigt die echte Mondphase. Unter Design lässt sich die Tageszeit automatisch oder fest wählen.','Neu: Nachts einen Song bewerten schaltet die geheime Trophäe „Nachtschwärmer“ frei. Danach ziehen im Design Gemächlich nachts Sternschnuppen über den Himmel.','Neu: Wischen zwischen Bewertungen, Künstlerliste und Statistik. Punkte oben zeigen die aktuelle Seite. Auch mit Alt + Pfeiltasten am Computer.','Neu: Akzentfarbe wählbar unter Design (nicht im Nothing-Design).','Neu: Alle Auswahlfelder öffnen jetzt ein eigenes Menü im Stil des jeweiligen Designs.','Geändert: Album- und Künstlerseite aufgeräumt. Sortieren und Filtern liegt in einem eigenen Fenster, alle weiteren Aktionen unter „Optionen“.','Geändert: Klassisch, Nothing und Glas wurden dezent aufgefrischt.']},
{v:'29.2',t:'Singles per MusicBrainz importieren',d:'Auf der Künstlerseite lassen sich alle Singles eines Künstlers in Jahresgruppen anlegen.',n:['Neu: Auf der Künstlerseite gibt es „Singles importieren“. Die App sucht den Künstler bei MusicBrainz und holt alle Singles mit allen Songs, auch B-Seiten, Remixe und Live-Versionen.','Du legst fest, welche Jahre zusammen eine Gruppe bilden, zum Beispiel 2001 allein und 2002 bis 2004 zusammen. Es gibt „Jedes Jahr einzeln“, „Alles in eine Gruppe“ und einen Vorschlag mit etwa gleich vielen Songs je Gruppe. Jede Lücke zwischen zwei Jahren lässt sich einzeln trennen oder verbinden.','Jede Gruppe wird als Single-Eintrag („Singles 2002–2004“) ohne Noten angelegt. Der Name ist änderbar. Ein Cover gibt es dabei noch nicht.','Jeder Song kommt nur einmal vor, auch wenn er auf mehreren Singles oder Re-Releases steckt. Songs, die schon in deinen Singles des Künstlers stehen, werden übersprungen.']},
{v:'29.1',t:'Bessere Sicherungs-Erinnerung',d:'Die App erinnert jetzt auch am Monatsende und weist nach einem Monat darauf hin, die Sicherung nicht nur auf dem Handy zu lassen.',n:['Neu: Am Monatsende (letzte drei Tage) erscheint einmal pro Monat eine Erinnerung zur Sicherung, auch wenn die letzte Sicherung noch jung ist.','Neu: Ist die letzte Sicherung oder die letzte Weitergabe 30 Tage oder älter, rät die Erinnerung, die Datei in eine Cloud zu laden, per WhatsApp oder E-Mail an dich zu schicken oder an Claude in den Chat zu senden.','Neu: Die Erinnerung hat einen Knopf „Teilen / in Cloud“ (wo dein Handy das Teilen von Dateien unterstützt). Danach zählt die Sicherung als weitergegeben.','Die wöchentliche Erinnerung bleibt wie bisher.']},
{v:'29',t:'Neubewertung, Zeitvergleich und Hör mal wieder rein',d:'Du kannst deine Noten vor einer Neubewertung sichern und später Damals und Jetzt vergleichen.',n:['Neu: „🔁 Neubewertung“ beim Künstler (ganzer Künstler oder einzelne Alben, EPs und Singles) und beim Album. Die App speichert deine aktuellen Noten mit dem heutigen Datum. Danach bewertest du ganz normal neu.','Neu: Unter Statistiken › Vergleich gibt es den dritten Reiter „Zeit“. Er zeigt Durchschnitt damals und jetzt, wie viele Songs gestiegen oder gefallen sind, die größten Sprünge, neue Songs und pro Album die einzelnen Änderungen.','Neu: „📊 Aus Statistiken ausnehmen“ beim Künstler. Ein ausgenommener Künstler zählt nicht mehr im Rückblick und in den Trophäen. Er bleibt in der Liste und im Vergleich sichtbar. Schon erreichte Trophäen bleiben.','Neu: „Hör mal wieder rein“ im Menü schlägt dir ein Album vor, das du länger nicht geöffnet hast (Standard: ab Ø 7, mindestens 3 bewertete Songs). Mit „Anderes“, „Gehört ✓“ und „Album öffnen“.']},
{v:'28.1',t:'Alben kopieren und bessere MusicBrainz-Suche',d:'Alben lassen sich ohne Noten zu einem anderen Künstler kopieren.',n:['Neu: Auf der Album-Seite gibt es „In anderen Künstler kopieren“, auf der Künstlerseite „Alle Alben kopieren“. Das Ziel ist ein anderer oder ein neuer Künstler. Alben und Songs kommen ohne Noten mit, auf Wunsch auch mit Noten und Herzen. Das Original bleibt unverändert.','Die MusicBrainz-Suche probiert nur den Titel, wenn unter dem Künstlernamen nichts zu finden ist, zum Beispiel nach einer Umbenennung. In der Trefferliste steht jetzt der Künstlername dabei.']},
{v:'28',t:'Songliste aus MusicBrainz und neue Trophäen',d:'Neue Alben lassen sich per Songliste anlegen, und die Trophäen sind jetzt ein Stempel-Album.',n:['Beim Anlegen von Alben, EPs und Singles gibt es den Zusatzknopf „Songs aus MusicBrainz laden“. Du suchst die Veröffentlichung, wählst eine Version (zum Beispiel Standard oder Deluxe) und hakst die Songs an, die du anlegen willst. Das normale Eintippen von Songs bleibt unverändert.','Trophäen: neues Siegel mit mittiger Zahl, ein Stempel-Album mit einem Stempel pro erreichter Stufe und neue Reihen (Künstler komplett bewertet, Genres entdeckt, Genre-Treue, Bewertungsserie).','Eine geheime Trophäe wartet irgendwo in der App.']},
{v:'27',t:'Künstler-Vergleich',d:'Zwei Künstler direkt vergleichen, mit aufklappbaren Alben.',n:['Im Vergleichs-Tab gibt es oben jetzt den Umschalter Alben | Künstler.','Künstler-Vergleich: Durchschnitt über die Alben, Durchschnitt über alle Songs, Median, beste und schlechteste Note, Zehner, Anteil ab 7, Herzen und Anzahl der Alben und Singles.','Darunter stehen die Alben und Singles beider Künstler paarweise, nach Rang oder nach Reihenfolge. Ein Tipp auf ein Album klappt die Songs auf, es gibt auch „Alle aufklappen“.','Auf der Künstlerseite gibt es den Knopf „Mit anderem Künstler vergleichen“.']},
{v:'26',t:'Trophäen und mehr Glas',d:'Das Trophäen-System ist da, und Glas sieht jetzt wirklich nach Glas aus.',n:['Neu: Trophäen im Menü. Es gibt Stufen für bewertete Songs (10 bis 10.000), komplett bewertete Alben, Künstler, Herzen, Zehner und Notizen. Was du schon erreicht hast, ist sofort freigeschaltet.','Bei einer neuen Trophäe erscheint eine kurze Meldung.','Glas: Der Hintergrund besteht jetzt aus farbigen Glasformen statt Lichtflecken, die Karten sind echtes Milchglas, und das Menü schwebt als runde Karte mit Pfeilen.']},
{v:'25.1',t:'Glas bekommt einen eigenen Charakter',d:'Das Glas-Design ist jetzt ein eigenes Thema, und der Punkt hat neue Effekte.',n:['Glas: schwebende Leiste oben, Songs als gruppierte Liste mit dünnen Trennlinien, ein farbiger, langsam driftender Hintergrund und federnde Knöpfe. Bei Alben mit Cover färbt sich der Hintergrund passend zum Cover.','Der rote Punkt neben Coda hat im Standard-Design jetzt Konfetti mit Ring und im Glas-Design Seifenblasen.']},
{v:'25',t:'Laufschrift, Glas-Prototyp und eine kleine Überraschung',d:'Lange Songtitel brauchen weniger Platz, und ein erstes Glas-Design ist da.',n:['Songtitel-Option im Design-Tab: „Komplett“ wie bisher oder „Laufschrift“. Bei der Laufschrift steht der Titel in einer Zeile. Ist er zu lang, beginnt er nach etwa zweieinhalb Sekunden langsam nach hinten zu laufen, hält kurz am Ende und springt zurück. Das gilt für Songs im Album, in der Suche, in den Rückblick-Listen und bei den Herzen und Zehnern.','Neues Design „Glas“ (Prototyp): durchscheinende Karten, weiche Farbverläufe, Unschärfe in der Kopfleiste und im Menü, runde Ecken und ein blauer Akzent. Es gibt eine helle und eine dunkle Variante.','Eine kleine Überraschung für Neugierige. Der rote Punkt hat ein Geheimnis.']},
{v:'24',t:'Notizen-Tab',d:'Alle Notizen an einem Ort, auch zu Künstlern und Alben.',n:['Neuer Menüpunkt „Notizen“: Hier stehen alle Notizen zu Künstlern, Alben, EPs, Singles und Songs. Filter: Alle, Künstler, Alben, Songs, Offen, Erledigt. Sortierung: Neueste oder Nach Künstler.','Bei jedem Künstler und jedem Album gibt es oben einen kleinen Knopf „Notiz“. Er öffnet den Notizen-Tab direkt mit dem Schreibfeld. Die Notiz steht danach auch bei dem Album oder Künstler als kleiner Streifen. „Zurück“ bringt dich wieder zum Album.','In jeder Notiz gibt es „Erledigt“ als Haken (zum Beispiel für „Songs ergänzen“), „Öffnen“ springt zum Künstler, Album oder Song. Mit „Neue Notiz“ legst du eine Notiz an, ohne vorher zum Album zu gehen.','Notizen, die du schon an Songs gemacht hast, erscheinen automatisch in der Liste und lassen sich dort bearbeiten.']},
{v:'23',t:'Großer Speicher',d:'Coda speichert jetzt in einem deutlich größeren Speicher und startet mit einem Umzug deiner Daten.',n:['Großer Speicher: Statt der etwa 5 MB, die ein Browser normalerweise erlaubt, nutzt Coda jetzt den Speicher des Handys (IndexedDB). Dort ist je nach Gerät Platz für hunderte MB oder mehr. Deine Daten ziehen beim ersten Start automatisch um.','Eigene Cover werden als echte Bilddateien gespeichert und nicht mehr als Text. Das spart etwa ein Drittel Platz und macht das Speichern schneller.','Die Speicher-Anzeige unter „Sicherung“ zeigt jetzt den echten freien Platz deines Handys und ob der Browser die Daten dauerhaft schützt.','Die automatischen Kopien liegen jetzt auch im großen Speicher und sind nicht mehr auf kleine Datenmengen begrenzt.'],c:['Zur Sicherheit schreibt Coda weiterhin eine leichte Kopie (ohne Cover) in den alten Speicher. Sollte der große Speicher nicht gehen, läuft die App wie bisher.']},
{v:'22',t:'Studio, Live, Remix im Rückblick',d:'Einfachere Auswahl im Rückblick und aufgeräumte Tabs.',c:['„Normal“ heißt jetzt „Studio“.','Im Rückblick gibt es statt der sechs Optionen drei Knöpfe: Studio, Live und Remix. Jeder Knopf schaltet seine Alben dazu oder wieder weg. Gefüllte Knöpfe sind aktiv, mindestens einer bleibt immer an.','Die Tab-Leiste unter dem Menü hat keinen „Suche“-Knopf mehr. Die Suche öffnest du mit der Lupe oben rechts.']},
{v:'21',t:'Live- und Remix-Alben',d:'Alben als Live oder Remix markieren und im Rückblick herausfiltern.',n:['In jedem Album (Alben und EPs) gibt es oben rechts einen Knopf „Normal“. Tippst du ihn an, wählst du Normal, Live oder Remix. Auf der Künstlerseite steht „Live“ oder „Remix“ bei dem Album.','Im Rückblick gibt es unter Alben, EPs, Singles und Alle eine Filterleiste: Alle Alben, Nur normale, Nur Live, Nur Remix, Normal + Live und Normal + Remix. Sie wirkt auf alle Zahlen im Rückblick, auch auf den Gesamtdurchschnitt.'],c:['Die Filterung gilt nur im Rückblick. Künstlerseiten, 10 von 10 und Suche zeigen weiterhin alles.']},
{v:'20',t:'Speicher-Anzeige und Song-Filter',d:'Mehr Überblick: wie voll Coda ist und welche Songs du suchst.',n:['Im Menü unter „Sicherung“ gibt es jetzt einen Bereich „Speicher“: Balken mit Prozentwert, aufgeteilt in Bewertungen, eigene Cover und automatische Kopien. Ab 80 % wird er rot und rät zur Sicherung.','Auf der Albumseite gibt es eine Filterleiste: Alle, ♥, Unter 5, Notiz und Ohne Note, jeweils mit Anzahl. Die Platznummern bleiben dabei die echten.']},
{v:'19',t:'Design-Feinschliff',d:'Präsentere Überschriften im Nothing-Design und Disc-Angaben bei den 10 von 10.',n:['Disc-Angabe bei den Songs mit 10 und in den Highlights: Liegt ein Song auf einer Disc, steht sie hinter dem Albumnamen, zum Beispiel „Meteora (Disc 2)“.'],c:['Die Abschnitte „Alben“, „EPs“ und „Singles“ auf der Künstlerseite sind im Nothing-Design größer und kräftiger wie im Standard-Design, mit einem Punkt zwischen Name und Zahl („Alben · 3“) und der Titel sitzt wieder links.','Im Menü steht bei Statistiken nur noch „Statistiken“.'],
 sub:[{v:'19.1',t:'Herz, Notizen, Genre-Farben',c:['Das Herz steht allein und größer neben der Note. Die Notiz hat einen schmalen Balken ganz rechts neben dem ✕. Der Balken ist farbig, wenn der Song eine Notiz hat.','Im Design-Tab sind die Genre-Farben einklappbar: jedes Genre ist eine Zeile mit Farbpunkt, Antippen öffnet die Farbauswahl. Dazu „Alle aufklappen“ und „Alle zuklappen“.'],f:['„Notiz löschen“ hat nicht funktioniert und die Notiz kam sofort zurück. Behoben.']}]},
{v:'18',t:'10 von 10 pro Künstler, Durchschnitt je Art, Zurück-Geste',d:'Schnellere Übersicht beim Künstler und natürlichere Navigation.',n:['Auf der Künstlerseite gibt es oben die Umschaltung „Alben | 10 von 10“. Die zweite Ansicht zeigt alle Songs mit 10 dieses Künstlers, doppelte Songs zählen einmal. Antippen öffnet den Song im Album.','Rechts neben „Alben“, „EPs“ und „Singles“ steht der Durchschnitt der jeweiligen Art (bei Singles der Durchschnitt aller Single-Songs). In der Ansicht „Nach Durchschnitt“ steht er als Zeile darüber.','Zurück-Geste: Wischen vom Rand oder die Zurück-Taste des Handys gehen in der App einen Schritt zurück (zum Beispiel vom Album zum Künstler) statt die App zu schließen. Ein offenes Menü schließt sich zuerst.','Die Scroll-Position bleibt erhalten: Wer weit unten ein Album öffnet und zurückgeht, landet wieder an derselben Stelle.'],c:['Beim Öffnen eines neuen Bereichs beginnt die Seite jetzt oben, statt an der alten Stelle zu bleiben.']},
{v:'17',t:'Aufgeräumtes Menü, Statistiken-Tab, Sortierauswahl',d:'Weniger im Menü, mehr Übersicht oben.',n:['Menü lässt sich jetzt nach unten wegwischen.','News haben einen eigenen Knopf oben rechts zwischen Suche und Menü, mit der Zahl der Neuigkeiten.','Neuer Bereich „Statistiken“ im Menü mit drei Reitern: Rückblick, Herzen und 10 von 10, Album-Vergleich.','Auf der Künstlerseite gibt es statt zwei Knöpfen eine Auswahl: Durchschnitt, Genre, Anzahl Singles, Anzahl Alben oder Alphabet.'],c:['Singles haben kein graues Cover-Feld mehr, nur noch Alben und EPs.','Das Menü enthält nur noch Statistiken, Design, Sicherung und das Archiv.'],
 sub:[{v:'17.1',t:'Skits ausblenden, Genre-Überschriften, Pixel-Zahlen',n:['In den News lassen sich bei „Angefangen, aber unbewertet“ einzelne Songs oder alle Songs eines Albums mit ✕ ausblenden, zum Beispiel Skits. Sie zählen dann nicht mehr als unbewertet. Im Album gibt es „Wieder anzeigen“, und „Rückgängig“ erscheint kurz nach dem Ausblenden.','Neue Einstellung im Design-Tab (nur Nothing): Zahlen-Schrift mit „Pixel“, „Pixel + Songs“ und „Normal“.'],c:['Die Genre-Überschriften auf der Künstlerseite sind heller und haben eine Linie, damit sie zwischen den farbigen Künstlern nicht untergehen.']},{v:'17.2',t:'Albumtitel bearbeiten',c:['Der Titel eines Albums wird nur noch im Album selbst bearbeitet (Stift neben dem Titel). Dort öffnet sich unter dem Kopf eine große Fläche mit Titel, Art und Jahr, ohne dass etwas hochrückt. In der Albumübersicht eines Künstlers gibt es den kleinen Stift nicht mehr.','Lange Titel wie „A Thousand Suns (Bonus Edition)“ sind im Nothing-Design kleiner dargestellt und laufen nicht mehr über den Bildschirm.']}]},
{v:'16',t:'Alben, EPs und Singles getrennt, Cover & Jahr von Hand, Plus-Knöpfe',d:'Saubere Statistik pro Veröffentlichungsart und schnelleres Anlegen.',n:['Rückblick getrennt nach Alben, EPs, Singles oder Alle. Kennzahlen, Notenverteilung, Top-Künstler, beste und schwächste Einträge, Jahre und Genres beziehen sich jeweils nur auf die gewählte Art.','Plus-Knöpfe rechts neben „Alben“, „EPs“ und „Singles“ auf der Künstlerseite. Antippen öffnet direkt ein Eingabefeld, mehrere Einträge hintereinander sind möglich. Das alte Formular ganz unten ist weg.','Cover von Hand: Im Album „Cover wählen“, ein Bild vom Handy aussuchen. Es wird quadratisch zugeschnitten und mit dem Album gespeichert, auch ohne Internet. „Cover entfernen“ macht es rückgängig. Eigene Cover haben Vorrang vor den automatischen.','Erscheinungsjahr von Hand: Im Album gibt es ein Feld „Jahr“.','Die Anzahl bei Künstlern zeigt jetzt „3 Alben · 1 EP · 12 Singles“ statt alles als Alben zu zählen.'],c:['Die Sortierung der Künstler nach Anzahl Alben zählt nur noch echte Alben, keine EPs oder Singles.','Wenn der Speicher voll ist, meldet Coda das, statt still nicht zu speichern.'],f:['Herzen im Rückblick wurden doppelt gezählt, wenn derselbe Song als Single und auf dem Album vorkam. Jetzt zählt er pro Künstler einmal, genau wie in den Highlights.']},
{v:'15',t:'Sicherung, Suche, Rückgängig, Cover, Rückblick, Verlauf & Notizen',d:'Mehr Sicherheit für deine Daten und mehr Überblick über deine Bewertungen.',n:['Sicherungs-Hinweis auf jeder Seite, sobald die letzte Sicherung 7 Tage her ist. „Jetzt sichern“ oder „Später erinnern“ (3 Tage Ruhe). Dazu „Teilen“, um die Datei direkt an Drive, WhatsApp oder andere Apps zu schicken.','Automatische Kopien: Coda legt täglich eine Kopie auf dem Handy an (die letzten drei) und auch vor jedem Einspielen einer Sicherung. Wiederherstellen im Menü unter Sicherung. Die Datei bleibt trotzdem wichtig. Außerdem bittet Coda den Browser, die Daten nicht automatisch zu löschen.','Suche überall: Lupe oben neben dem Menü. Sucht jetzt auch in deinen Song-Notizen.','Rückgängig: Nach dem Löschen eines Songs, Albums, Künstlers, Genres oder Eintrags erscheint unten für ein paar Sekunden „Rückgängig“.','Album-Cover (optional, Menü > Design): holt Cover über MusicBrainz und das Cover Art Archive und zeigt sie in der Albenliste, im Album und im Vergleich.','Rückblick (Menü): Kennzahlen, Notenverteilung, Top-Künstler, beste und schwächste Alben, Durchschnitt pro Erscheinungsjahr und pro Genre. Die Jahre trägst du über ✎ am Album ein oder holst sie automatisch über MusicBrainz.','Verlauf der Diskografie auf der Künstlerseite: Kurve und Balken aller Alben nach Jahr, dazu Tendenz, bestes und schwächstes Album.','Notizen zu Songs: der Knopf ✎ unter dem Herz öffnet ein Textfeld, zum Beispiel „bester Refrain“.'],c:['Alben haben im Bearbeiten-Formular jetzt ein Jahr-Feld.']},
{v:'14',t:'Album-Vergleich & Sortierung nach Durchschnitt',d:'Zwei Alben direkt gegeneinander stellen und die Alben eines Künstlers nach Note ordnen.',n:['Neuer Vergleich im Menü („⇄ Album-Vergleich“): Wähle zwei Alben, auch von verschiedenen Künstlern, zum Beispiel OK Computer gegen Kid A oder gegen ein Album von Linkin Park.','Gegenüberstellung mit Durchschnitt, Median, bester und schlechtester Note, Anzahl der Zehner, Anteil ab 7 und Herzen. Der bessere Wert ist grün, dazu ein Satz, wer wie viele Punkte vorne liegt.','Song für Song in zwei Spalten, wahlweise „Nach Rang“ (bester gegen besten) oder „Nach Reihenfolge“ (Song 1 gegen Song 1). Der bessere Song jedes Paars ist markiert.','Im Album gibt es den Knopf „Mit anderem Album vergleichen“, der das Album gleich als erste Seite einsetzt. „Tauschen“ und „Leeren“ helfen beim Umstellen.','Auf der Künstlerseite lassen sich die Alben jetzt „Nach Reihenfolge“ oder „Nach Durchschnitt“ anzeigen. Letzteres ist eine gemeinsame Rangliste aller Alben, EPs und Singles-Sammlungen.'],c:['Die Auswahl im Vergleich bleibt gespeichert und ist Teil der Sicherung.']},
{v:'13',t:'Archiv',d:'Alle Updates an einem Ort, von Anfang an nachlesbar.',n:['Neues Archiv ganz unten im Menü (☰) mit allen Patch Notes.','Nummerierung: große Neuerungen zählen hoch (Update 12, 13 …), Verbesserungen laufen als Unternummer (12.1, 12.2 …).','Aufklappbare Einträge, der neueste ist offen. Mit „Alle aufklappen“ siehst du alles.','Die frühen Einträge wurden nachträglich aus dem Verlauf rekonstruiert.']},
{v:'12',t:'Design-Tab, Highlights & News-Hinweis',d:'Mehr Übersicht bei vielen Songs und ein eigener Bereich für das Aussehen.',n:['Der News-Hinweis auf der Startseite hat ein ✕. Er kommt erst wieder, wenn mehr Neuigkeiten da sind als beim Schließen.','Highlights lassen sich pro Künstler oder Genre auf- und zuklappen, dazu „Alle aufklappen“ und „Alle zuklappen“.','Suche in den Highlights über Song, Album, Künstler und Genre. Treffer klappen automatisch auf.','Eigener Design-Tab im Menü mit Stil (Standard oder Nothing) und Darstellung (Automatisch, Hell, Dunkel).','Künstler hervorheben: Aus, Lila, Rot oder Eigene Farben pro Genre (9 Farben), wahlweise unterstrichen oder markiert, mit Vorschau.'],c:['Stil und Darstellung sind aus dem Menü in den Design-Tab gewandert.'],
 sub:[{v:'12.1',t:'Menü im Nothing-Design deckend',f:['Das Menü und die Karten im Nothing-Design waren durchsichtig, weil ein Farbwert ungültig war. Jetzt sind sie deckend, im Dunkel- wie im Hellmodus.','Der Hintergrund hinter dem Menü wird stärker abgedunkelt.']}]},
{v:'11',t:'Neuerscheinungen',d:'Die App erkennt, wenn deine Künstler etwas Neues veröffentlichen, und legt es auf Wunsch fertig an.',n:['Bis zu 5 Künstler lassen sich mit der Musikdatenbank MusicBrainz verknüpfen.','Die App prüft beim Öffnen (höchstens alle 6 Stunden), ob es Alben, EPs oder Singles gibt, die noch nicht bei dir stehen.','„Hinzufügen“ legt ein Album oder eine EP mit vollständiger Tracklist an, bei mehreren Discs mit Disc-Überschriften. Singles landen im Singles-Album des Jahres, zum Beispiel „Singles 2026“.','Live, Remix und Sampler lassen sich weglassen oder anzeigen. Die Prüfung kann komplett aus- und eingeschaltet werden.','Neu angelegte Alben zeigen ihr Erscheinungsjahr.'],
 sub:[{v:'11.1',t:'News-Seite, Sicherungs-Fenster, Sortierung nach Alben',c:['Aus „Neuerscheinungen“ wurde die Seite „News“ mit zwei Tabs: News und Einstellungen.','Die App zeigt jetzt alles, was du noch nicht bewertet hast, nicht nur das, was nach dem Verknüpfen neu erschien. Der Abgleich ignoriert Zusätze wie „Deluxe Edition“.'],n:['Liste „Angefangen, aber unbewertet“ für Alben mit Songs ohne Note.','Die Sicherung hat ein eigenes Fenster im Menü. Auf der Startseite steht sie nicht mehr.','Künstler lassen sich nach Anzahl der Alben sortieren. Die Einstellung steckt im Menü, die zwei Knöpfe auf der Startseite bleiben.','Mit „Alle ausblenden“ räumst du lange Listen mit einem Tipp auf.']}]},
{v:'10',t:'Menü, Hell/Dunkel & Highlights',d:'Eine Menüleiste mit allem Wichtigen und eine Übersicht deiner besten Songs.',n:['Feste Kopfleiste mit ☰-Menü. Es öffnet ein Fenster von unten.','Darstellung Automatisch, Hell oder Dunkel in beiden Designs, auch ein helles Nothing.','Highlights mit allen ♥-Songs und allen 10/10-Songs. Filter: Alle, Herzen oder 10/10. Sortierung: nach Künstler oder Genre. Ein Tipp springt ins Album.','Alben lassen sich direkt in der Künstler-Ansicht löschen (✕ mit Rückfrage).'],c:['Der ♥-Tab wurde zu Highlights im Menü. Die Tab-Leiste hat jetzt drei Tabs.','Startseite heißt „Künstler“.'],
 sub:[{v:'10.1',t:'Keine doppelten Songs in den Highlights',f:['Ein Song, der als Single und im Album vorkommt, erscheint in den Highlights nur noch einmal. Es gilt die höchste Note, und ein Herz an einer Version reicht.','Die Zähler zählen ebenfalls nur noch einmal.']}]},
{v:'9',t:'Design-Umschalter',d:'Zwei Looks, zwischen denen du wechseln kannst.',n:['Neuer Look „Nothing“: Schwarz, Punktraster, Punktschrift (Doto), rote Akzente und abgerundete Pillen.','Umschalter zwischen Klassisch und Nothing. Die Wahl bleibt gespeichert.']},
{v:'8',t:'Coda wird eine echte App',d:'Aus der Seite wurde eine installierbare App mit eigenem Namen und Logo.',n:['Installierbar auf dem Homescreen über GitHub Pages (PWA), mit eigenem Fenster ohne Browserleiste.','Neuer Name: Coda. Neues Logo im Nothing-Stil: ein C aus weißen Punkten auf Schwarz mit rotem Punkt.','Läuft auch ohne Internet. Updates kommen durch Austausch der Dateien bei GitHub.','Für dich und deinen besten Freund dieselbe App, jeder mit eigenen Daten auf dem eigenen Handy.'],c:['Deine Daten zogen per Sicherungsdatei in die installierte App um.']},
{v:'7',t:'Suche, Herzen-Liste & Sicherung',d:'Mehr Überblick und Schutz vor Datenverlust.',n:['Suche über alle Songs, Alben und Künstler, auch mit mehreren Wörtern. Ein Tipp springt ins Album und markiert den Song.','Tab mit allen Songs, die ein ♥ haben.','Schalter im Album: „Nach Note“ oder „Eingabe-Reihenfolge“. Bei gleicher Note ordnest du mit ▲▼ selbst.','Sicherung als eine Datei, mit Vorschau vor dem Einspielen und Erinnerung nach 14 Tagen. Text-Sicherung als Notlösung.'],
 sub:[{v:'7.1',t:'Sicherung speichern in der Claude-App',f:['Das Speichern der Sicherungsdatei ging in der Claude-App nicht. Jetzt läuft es über die Download-Freigabe der App.']}]},
{v:'6',t:'Import & Bearbeiten',d:'Songs und Alben schneller eintragen und Fehler selbst korrigieren.',n:['Import-Feld: ein ganzes Album oder mehrere Alben einfügen. Die App erkennt Titel und Noten.','Word-Dateien (.docx) hochladen, auch mit mehreren Künstlern in einer Datei, mit Vorschau vor dem Übernehmen.','Eine 11 wird zur 10 mit Herz. Formate wie „Song: (7/10)“ werden erkannt.','Stift zum Bearbeiten von Künstler, Album und Song, auch Name und Typ eines Albums.']},
{v:'5',t:'Genres, Notenfarben & Version für den Freund',d:'Mehr Ordnung und bessere Lesbarkeit.',n:['Künstler lassen sich nach Genre sortieren, neue Genres lassen sich anlegen.','Notenfarben: 10 bis 7 grün, 6 bis 4 orange, 3 bis 0 rot.','Leere Version für deinen besten Freund ohne deine Daten.']},
{v:'4',t:'Künstler verketten',d:'Zusammengehörige Künstler stehen hintereinander.',n:['DAT ADAM, TJ_babybrain und TJ_beastboy lassen sich zu einer Kette verbinden, in dieser Reihenfolge.']},
{v:'3',t:'Alle deine Künstler & Herzen',d:'Deine echten Bewertungen aus den Word-Dateien in der App.',n:['Alle Künstler und Alben aus deinen Word-Dateien eingespielt.','Herz-Funktion für Songs, die dir besonders gefallen.','Beim Hinzufügen wählst du Songs mit Note und Herz.'],
