function R(){

    if(D.sg){[...D.genres.map(g=>g.n),''].forEach(gn=>{const l=arts.filter(x=>genreOf(x)===gn);if(l.length)h+=`<h2>${esc(gn||'Ohne Genre')} <span class="m">${l.length}</span></h2>`+l.map(x=>row(x,false)).join('')})}

    h+='<div class="add"><input id="in" placeholder="Neues Album"><select id="ty"><option value="0">Album</option><option value="1">EP</option><option value="2">Single</option></select><button class="btn" data-a="addAlb">Hinzufügen</button></div>';
    h+=impBox();

  }else{
    const row=(s,i,L)=>{if(isEd('song',s.id))return `<div class="row"><span class="rk">${i+1}</span>${edForm(s.id,s.n)}</div>`;const u=i>0&&L[i-1].r===s.r,d=i<L.length-1&&L[i+1].r===s.r;return `<div class="row${s.id===hl?' hl':''}"><span class="rk">${i+1}</span>${D.so?'':`<div class="mv"><button class="ghost" data-a="up" data-i="${s.id}" ${u?'':'disabled'}>▲</button><button class="ghost" data-a="dn" data-i="${s.id}" ${d?'':'disabled'}>▼</button></div>`}<div class="grow t nm" data-a="edit" data-k="song" data-i="${s.id}">${esc(s.n)}</div><button class="ghost hb ${s.h?'on':''}" data-a="ht" data-i="${s.id}">${s.h?'♥':'♡'}</button><input class="r" style="border-color:${col(s.r)};color:${col(s.r)}" inputmode="decimal" value="${s.r==null?'':fmt(s.r)}" data-i="${s.id}" placeholder="–"><button class="ghost" data-a="rm" data-i="${s.id}">✕</button></div>`};
    h=`<button class="back" data-a="art" data-i="${A.id}">‹ ${esc(A.n)}</button>${isEd('alb',B.id)?edForm(B.id,B.n,B.k||0):`<h1>${esc(B.n)} ${pen('alb',B.id)}</h1>`}<p class="sub">Durchschnitt ${fmt(albAvg(B))} · ${B.songs.length} Songs${B.songs.some(s=>s.h)?' · ♥ '+B.songs.filter(s=>s.h).length:''}</p><div class="tabs"><button class="${D.so?'ghost':'btn'}" data-a="so" data-i="0">Nach Note</button><button class="${D.so?'btn':'ghost'}" data-a="so" data-i="1">Eingabe-Reihenfolge</button></div>`;
    h+=groups(B).map(([d,g])=>{const L=D.so?g:sortS(g);return (d?`<div class="disc"><span class="t">${esc(d)}</span><span class="m">Ø ${g.length} Songs</span>${chip(avg(g.map(s=>s.r)))}</div>`:'')+L.map((s,i)=>row(s,i,L)).join('')}).join('');
    h+='<h2>Songs hinzufügen</h2><input id="dc" placeholder="Disc (optional), z. B. Disc 2" style="margin-bottom:8px"><textarea id="in" placeholder="Ein Song pro Zeile, z. B.&#10;Runaway: 10&#10;Crawling: 9,5"></textarea><button class="btn" data-a="addSongs">Hinzufügen</button>';
    h+='<p class="m">'+(D.so?'Die Eingabe-Reihenfolge ist die Reihenfolge, in der die Songs eingetragen wurden. ':'Songs mit gleicher Note kannst du mit ▲▼ selbst anordnen. ')+'Tippe auf einen Songnamen, um ihn zu korrigieren.</p>'+del('alb','Album löschen');
  }
  document.getElementById('app').innerHTML=topbar()+h+menuHtml();{const eb=document.getElementById('ed');if(eb){eb.focus();eb.select()}const hr=document.querySelector('.row.hl');if(hr)hr.scrollIntoView({block:'center'})}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;if(t.dataset.a!=='edsave'&&t.dataset.a!=='edit')ed=null;if(t.dataset.a!=='go')hl=null;
  const a=t.dataset.a,i=t.dataset.i,v=(document.getElementById('in')||{}).value||'';
  msg='';bmsg='';const A=D.artists.find(x=>x.id===st.a),B=A&&A.albums.find(x=>x.id===st.b);
  if(a==='home'){st={t:st.t,a:null,b:null}}
  else if(a==='art'){st={t:'rate',a:i,b:null}}
  else if(a==='alb'){st.b=i}
  else if(a==='addArt'&&v.trim()){D.artists.push({id:uid(),n:v.trim(),albums:[]})}
  else if(a==='addAlb'&&v.trim()){A.albums.push({id:uid(),n:v.trim(),k:+document.getElementById('ty').value,songs:[]})}
  else if(a==='addSongs'){{const d=(document.getElementById('dc').value||'').trim();B.songs.push(...parse(v).map(s=>d?{...s,d}:s))}}
  else if(a==='up'||a==='dn'){
    const S0=B.songs.find(s=>s.id===i),L=sortS(B.songs.filter(s=>(s.d||'')===(S0.d||''))),k=L.findIndex(s=>s.id===i),o=L[k+(a==='up'?-1:1)];
    if(o&&o.r===L[k].r){const grp=L.filter(s=>s.r===L[k].r),a1=grp.indexOf(L[k]),b1=grp.indexOf(o);[grp[a1],grp[b1]]=[grp[b1],grp[a1]];grp.forEach((s,n)=>s.o=n)}}
  else if(a==='aup'||a==='adn'){const x=A.albums.find(y=>y.id===i),g=A.albums.filter(y=>(y.k||0)===(x.k||0)),o=g[g.indexOf(x)+(a==='aup'?-1:1)];
    if(o){const p=A.albums.indexOf(x),q=A.albums.indexOf(o);[A.albums[p],A.albums[q]]=[A.albums[q],A.albums[p]]}}
  else if(a==='ht'){const s=B.songs.find(y=>y.id===i);s.h=s.h?0:1}
  else if(a==='rm'){B.songs=B.songs.filter(s=>s.id!==i)}
  else if(a==='del'){
    if(armed!==t.dataset.k){armed=t.dataset.k;R();return}
    if(armed.startsWith('g:')){D.genres=D.genres.filter(x=>'g:'+x.id!==armed)}
    else if(armed==='art'){D.artists=D.artists.filter(x=>x.id!==A.id);st={t:st.t,a:null,b:null}}
    else{A.albums=A.albums.filter(x=>x.id!==B.id);st.b=null}
  }
  else if(a==='exp'){D.lb=Date.now();bk=JSON.stringify(D)}
  else if(a==='bdl'){dlBackup();return}
  else if(a==='dsn'){try{localStorage.setItem('coda_design',i)}catch(x){}window.__ap()}
  else if(a==='mode'){try{localStorage.setItem('coda_mode',i)}catch(x){}window.__ap()}
  else if(a==='mnw'){menuOpen=false;st={t:'nw',a:null,b:null}}
  else if(a==='nwx'){D.nd=nwCount()}
  else if(a==='mds'){menuOpen=false;st={t:'ds',a:null,b:null}}
  else if(a==='ac'){D.ac=i}
  else if(a==='am'){D.am=+i}
  else if(a==='gc'){const g=t.dataset.g;D.gc=D.gc||{};if(i==='none')delete D.gc[g];else D.gc[g]=i}
  else if(a==='hxt'){if(hxs.has(i))hxs.delete(i);else hxs.add(i)}
  else if(a==='hxall'){if(+i)hlKeys().forEach(k=>hxs.add(k));else hxs.clear()}
  else if(a==='mar'){menuOpen=false;st={t:'ar',a:null,b:null}}
  else if(a==='axt'){if(arx.has(i))arx.delete(i);else arx.add(i)}
  else if(a==='axall'){if(+i)UPD.forEach(u=>arx.add(u.v));else arx.clear()}
  else if(a==='mbk'){menuOpen=false;st={t:'bk',a:null,b:null}}
  else if(a==='sm'){D.sm=+i}
  else if(a==='nwtab'){nwTab=i}
  else if(a==='nwignall'){if(armed!=='nwia'){armed='nwia';R();return}const N=NW();nwItems().forEach(x=>N.ign.push(x.id))}
  else if(a==='nwon'){NW().on=+i;if(+i)setTimeout(()=>nwCheck(true),0)}
  else if(a==='nwlive'){NW().live=+i}
  else if(a==='nwcheck'){nwCheck(true);return}
  else if(a==='nwsearch'){const v=(document.getElementById('nwsel')||{}).value;if(v)nwSearchRun(v);return}
  else if(a==='nwpick'){if(nwCand&&nwCand[+i])nwFollow(nwCand[+i]);return}
  else if(a==='nwcancel'){nwCand=null;nwMsg=''}
  else if(a==='nwrm'){const N=NW();N.a=N.a.filter(f=>f.id!==i)}
  else if(a==='nwadd'){nwAdd(i);return}
  else if(a==='nwign'){const N=NW();if(!N.ign.includes(i))N.ign.push(i)}
  else if(a==='menu'){menuOpen=true}
  else if(a==='mclose'){menuOpen=false}
  else if(a==='mhl'){menuOpen=false;st={t:'hearts',a:null,b:null}}
  else if(a==='hf'){D.hf=i}
  else if(a==='hg'){D.hg=i}
  else if(a==='dalb'){const k='a:'+i;if(armed!==k){armed=k;R();return}A.albums=A.albums.filter(x=>x.id!==i)}
  else if(a==='bapply'){D=bpend;bpend=null;save();location.reload();return}
  else if(a==='bcancel'){bpend=null}
  else if(a==='so'){D.so=+i}
  else if(a==='go'){st={t:'rate',a:t.dataset.ar,b:t.dataset.al};hl=t.dataset.s||null}
  else if(a==='imp'){try{const j=JSON.parse(document.getElementById('bk').value);if(j&&Array.isArray(j.artists))bpend=j;else bmsg='Das ist keine gültige Sicherung.'}catch(x){bmsg='Das ist keine gültige Sicherung.'}}
  else if(a==='sg'){D.sg=+i}
  else if(a==='tab'){st={t:i,a:null,b:null}}
  else if(a==='tg'){const x=D.genres.find(y=>y.id===t.dataset.g).items.find(y=>y.id===i);x.done=!x.done}
  else if(a==='rmItem'){const g=D.genres.find(y=>y.id===t.dataset.g);g.items=g.items.filter(y=>y.id!==i)}
  else if(a==='addItem'){const n=t.previousElementSibling.value.trim();if(n)D.genres.find(y=>y.id===t.dataset.g).items.push({id:uid(),n,done:false})}
  else if(a==='addGenre'&&v.trim()){D.genres.push({id:uid(),n:v.trim(),items:[]})}
  else if(a==='open'){let x=D.artists.find(y=>y.n.toLowerCase()===t.dataset.n.toLowerCase());if(!x){x={id:uid(),n:t.dataset.n,albums:[]};D.artists.push(x)}st={t:'rate',a:x.id,b:null}}
  else if(a==='chk'){impText=document.getElementById('imp').value;pend=[{a:null,al:analyze(impText)}].filter(x=>x.al.length)}
  else if(a==='apply'){applyImp()}
  else if(a==='cancel'){pend=null;impText=''}
  else if(a==='edit'){ed={k:t.dataset.k,i:i,g:t.dataset.g}}
  else if(a==='edcancel'){ed=null}
  else if(a==='edsave'){doEdSave()}
  else return;
  if(a!=='edit')armed='';save();R();
});
