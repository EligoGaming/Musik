<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060606">
<title>Nachtschicht Kamera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&family=Oswald:wght@500;700&display=swap">
<style>
/* Layout: Spielbares Handy-Minispiel in drei Nächten. Oben der Flur (Canvas mit Seitentür rechts), darunter ein kleiner Röhrenmonitor mit Meldungen, unten zwei große Knöpfe (Flurlicht halten, Tür antippen) und der Strom. Ein Look, dunkel. */
:root{color-scheme:dark;--page:#060606;--page-tx:#b9b6ad;--page-mute:#7d7a72;--glow:#8dffae;--amber:#ffb454;--paper:#e2dcb8;--rec:#d6402f;--fd:"Oswald",Impact,sans-serif;--ft:"Special Elite","Courier New",monospace;--fm:"VT323","Courier New",monospace}
*{box-sizing:border-box}
html,body{background:var(--page)}
body{margin:0;color:var(--page-tx);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding-inline:16px;padding-block:16px 32px}
.intro{max-width:430px;margin:0;font-size:14px;line-height:1.5;color:var(--page-mute);text-align:center}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tools button{font:600 13px system-ui,sans-serif;border:1px solid #2d2c28;background:#100f0d;color:var(--page-tx);padding:7px 13px;border-radius:99px;cursor:pointer}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.phone{position:relative;width:100%;max-width:390px;height:850px;border-radius:30px;overflow:hidden;border:1px solid #26241f;background:#0b0a09;font-family:var(--fm);color:var(--glow);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.scene{position:relative;height:340px;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07) 0,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 60%,rgba(255,255,255,.04) 72%,rgba(255,255,255,0) 80%);box-shadow:inset 0 0 40px 8px rgba(0,0,0,.85),inset 0 0 0 3px #0c0b0a}
.clock{position:absolute;top:10px;right:12px;font:26px/1 var(--fm);color:#ff4a3a;text-shadow:0 0 8px #ff2a1a,0 0 2px #ff9a8a;background:rgba(10,0,0,.7);border:1px solid #2a1210;padding:3px 8px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.night{position:absolute;top:14px;left:14px;font:18px var(--fm);color:#d8cfa8;letter-spacing:.12em;opacity:.9}
.sill{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(#2a241c,#14110d);border-top:1px solid #4a4032}
.desk{position:relative;height:510px;background:radial-gradient(ellipse 80% 40% at 50% 8%,rgba(141,255,174,.10),transparent 70%),repeating-linear-gradient(92deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px),linear-gradient(#1b140e,#0d0a07);padding:14px 16px 0;display:flex;flex-direction:column;gap:14px}
.mon{position:relative;margin:0 auto;width:100%;max-width:340px;background:linear-gradient(#cdc6b1,#a79f8b);border-radius:14px 14px 8px 8px;padding:12px 12px 20px;box-shadow:0 14px 24px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25)}
.led{position:absolute;right:18px;bottom:6px;width:7px;height:7px;border-radius:50%;background:#3dff7a;box-shadow:0 0 6px #3dff7a}
.scr{position:relative;height:150px;border-radius:14px/18px;background:#06110a;overflow:hidden;box-shadow:inset 0 0 28px 6px #000,inset 0 0 0 2px #14201a;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.scr::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,rgba(141,255,174,.07),transparent 60%,rgba(0,0,0,.55) 100%)}
.scr>*{text-shadow:0 0 5px rgba(141,255,174,.55)}
.scr h3{margin:0;font:700 17px var(--fd);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #1f4a2e;padding-bottom:3px;display:flex;justify-content:space-between}
.log{font-size:19px;line-height:1.15;overflow:hidden;flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.log div{opacity:.55}.log div:last-child{opacity:1}.log .w{color:var(--amber)}.log .r{color:#ff6a58}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;margin:0 auto;width:100%}
.kb{border:0;border-radius:12px;color:#fff3ee;font:700 20px/1.1 var(--fd);letter-spacing:.08em;text-transform:uppercase;padding:18px 6px 16px;cursor:pointer;touch-action:none;transition:transform .08s,box-shadow .08s}
.kb small{display:block;font:15px var(--fm);letter-spacing:.06em;opacity:.8;margin-top:4px;text-transform:none}
#bl{background:radial-gradient(circle at 50% 30%,#e8503e,#8e1d12 70%);box-shadow:0 7px 0 #4a0f09,0 12px 16px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3)}
#bd{background:radial-gradient(circle at 50% 30%,#d6a53a,#7a5410 70%);box-shadow:0 7px 0 #3c2806,0 12px 16px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3)}
#br{grid-column:1/-1;background:radial-gradient(circle at 50% 30%,#4fb7ff,#14507f 70%);box-shadow:0 7px 0 #0a2a44,0 12px 16px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3)}
#br[hidden]{display:none}
.kb.on,.kb:active{transform:translateY(6px)}
#bl.on,#bl:active{box-shadow:0 1px 0 #4a0f09,0 3px 6px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3)}
#bd.on,#bd:active{box-shadow:0 1px 0 #3c2806,0 3px 6px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3)}
.kb[disabled]{filter:grayscale(.9) brightness(.5);cursor:not-allowed}
.pm{max-width:340px;margin:0 auto;width:100%;background:linear-gradient(#26231e,#14120f);border:1px solid #3a352c;border-radius:6px;padding:8px 12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);display:flex;align-items:center;gap:10px}
.pm span{font:17px var(--fm);color:#aaa28d;letter-spacing:.1em}
.cells{flex:1;display:flex;gap:3px}.cells i{flex:1;height:16px;background:#1d2a20;border-radius:1px}.cells i.on{background:var(--glow);box-shadow:0 0 5px rgba(141,255,174,.7)}.pm.low .cells i.on{background:#ff5a47;box-shadow:0 0 5px #ff5a47}
.pm b{font:24px var(--fm);color:var(--paper);min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.use{max-width:340px;margin:0 auto;width:100%;display:flex;justify-content:space-between;font:16px var(--fm);color:#8d8672;letter-spacing:.06em}
.ov{position:absolute;inset:0;z-index:50;background:rgba(3,3,2,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.ov[hidden]{display:none}
.ov h2{margin:0;font:700 52px/1 var(--fd);color:var(--paper);letter-spacing:.06em;text-wrap:balance}
.ov p{margin:0;font:15px/1.5 var(--ft);color:#cfc9b0;max-width:280px}
.ov .nb{display:flex;flex-direction:column;gap:8px;width:230px}
.ov button{font:500 18px var(--fd);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--amber);background:transparent;color:var(--amber);padding:10px 20px;cursor:pointer}
.ov button[disabled]{opacity:.35;cursor:not-allowed}
.ov .sm{font-size:14px;border-color:#555;color:#999;padding:6px 12px}
.trf{font:14px/1.4 var(--ft);color:var(--glow);border:1px dashed #2d5a3a;padding:8px 12px;max-width:280px}
.kb#bc{background:radial-gradient(circle at 50% 30%,#3fb59a,#14594a 70%);box-shadow:0 6px 0 #082e26,0 10px 14px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3);padding:11px 6px 9px}
#bc.on,#bc:active{box-shadow:0 1px 0 #082e26,0 3px 6px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3)}
#bc[hidden]{display:none}
.cams{display:none;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:3px}
.scr.cam .log{display:none}.scr.cam .cams{display:grid}
.cams button{font:17px/1.1 var(--fm);white-space:nowrap;color:var(--glow);background:transparent;border:1px solid #1f4a2e;padding:3px 6px;text-align:left;cursor:pointer;text-shadow:0 0 5px rgba(141,255,174,.55)}
.cams button.sel{background:#143a22;color:#e2ffe9;border-color:var(--glow)}
.calert{display:none;font-size:17px;line-height:1.1;color:var(--amber);min-height:19px;margin-top:2px}.calert.r{color:#ff6a58}.scr.cam .calert{display:block}
.cl{position:absolute;left:14px;bottom:22px;font:20px var(--fm);color:#d6ffe4;text-shadow:0 0 6px #5f9;letter-spacing:.08em}
.rec{position:absolute;left:14px;top:38px;font:18px var(--fm);color:#ff5a47;letter-spacing:.1em;animation:bk 1.2s steps(2) infinite}
@keyframes bk{50%{opacity:.2}}
.cl[hidden],.rec[hidden]{display:none}
.kb#bt{background:radial-gradient(circle at 50% 30%,#8a6ad8,#3d2a7a 70%);box-shadow:0 6px 0 #1d1240,0 10px 14px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3);padding:11px 6px 9px}
#bt:active,#bt.on{transform:translateY(5px);box-shadow:0 1px 0 #1d1240,0 3px 6px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.3)}
#bt[hidden]{display:none}
#bl.fl{background:radial-gradient(circle at 50% 30%,#f2f2e8,#8a8f86 70%);color:#10130f}
.wires{max-width:340px;margin:0 auto;width:100%;background:linear-gradient(#26231e,#14120f);border:1px solid #3a352c;border-radius:8px;padding:8px 12px 10px}
.wires[hidden]{display:none}
.wires h4{margin:0 0 6px;font:500 17px var(--fd);letter-spacing:.1em;text-transform:uppercase;color:#ff6a58}
.wc{display:grid;grid-template-columns:1fr 1fr;gap:6px 56px}
.wc button{height:38px;border-radius:6px;border:2px solid #000;font:700 22px var(--fd);cursor:pointer}
.wc .wl{color:#111}.wc .wr{background:#0c0b09!important;border-width:3px}
.wc .sel{outline:3px solid #fff;outline-offset:1px}.wc .ok{opacity:.35;cursor:default}
.wires.sh{animation:sk .3s steps(3)}
.hb{position:absolute;inset:0;z-index:60;background:rgba(6,6,5,.98);display:flex;flex-direction:column;padding:18px 16px 16px;gap:10px}
.hb[hidden]{display:none}
.hb h2{margin:0;font:700 36px/1 var(--fd);color:var(--paper);letter-spacing:.06em}
.hbi{margin:0;font:13px/1.4 var(--ft);color:#8d8672}
.hbl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.hbc{display:flex;gap:12px;border:1px solid #2d2c28;background:#100f0d;padding:8px}
.hbc canvas{width:96px;height:112px;flex:none;border-radius:4px;background:#25352b}
.hbc h3{margin:0 0 4px;font:500 20px var(--fd);letter-spacing:.08em;color:var(--amber);text-transform:uppercase}
.hbc p{margin:0;font:14px/1.45 var(--ft);color:#cfc9b0}
.hbc.lk h3,.hbc.lk p{color:#6f6b5f}
.hb button{font:500 18px var(--fd);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--amber);background:transparent;color:var(--amber);padding:10px 20px;cursor:pointer}
.hit{position:absolute;inset:0;z-index:45;pointer-events:none;background:#7a0000;opacity:0}
.hit.on{animation:hit .8s steps(8)}
@keyframes hit{0%{opacity:1}30%{opacity:.3}45%{opacity:.9}100%{opacity:0}}
.shake{animation:sk .45s steps(4)}
@keyframes sk{25%{transform:translate(5px,-4px)}50%{transform:translate(-6px,3px)}75%{transform:translate(4px,4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* App-Einbindung: Spielfläche wird auf den Bildschirm skaliert */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{padding:calc(8px + env(safe-area-inset-top,0px)) 0 0;gap:8px;display:flex;align-items:center}
.phone{flex:none;width:390px;max-width:none;transform-origin:50% 0;border-radius:0 0 30px 30px}
.tools{flex:none}
</style>
